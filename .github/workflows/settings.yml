# .github/workflows/settings.yml
# -------------------------------------------------
# This workflow runs once (on workflow_dispatch) and
# uses the GitHub REST API to enforce the branch‑protection
# rules you described for the `main` branch.
# -------------------------------------------------
name: Repository Settings

on:
  workflow_dispatch: # run manually from the Actions UI

permissions:
  contents: read
  pull-requests: read

jobs:
  protect-main:
    runs-on: ubuntu-latest
    steps:
      - name: Set branch protection on main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const branch = "main";

            // 1. Require status checks (lint, typecheck, test, precommit)
            const requiredChecks = [
              "lint",          // job name from ci.yml
              "typecheck",    // job name from ci.yml
              "test",          // job name from ci.yml (matrix job)
              "precommit"      // job name from ci.yml
            ];

            // 2. Require at least one approving review
            const protectionSettings = {
              required_status_checks: {
                strict: true,
                contexts: requiredChecks
              },
              enforce_admins: true,
              required_pull_request_reviews: {
                required_approving_review_count: 1,
                dismiss_stale_reviews: true,
                require_code_owner_reviews: true   // ensures a code-owner/maintainer signs off
              },
              restrictions: null,
              required_linear_history: true,
              allow_force_pushes: false,
              allow_deletions: false
            };

            // Apply the protection rule
            await github.repos.updateBranchProtection({
              owner,
              repo,
              branch,
              ...protectionSettings
            });

            console.log(`✅ Branch protection applied to ${branch}`);
